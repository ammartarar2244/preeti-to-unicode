<div class="tool-section">
    <div class="tool-header">
        <h1 class="tool-title">Lok Sewa Typing Practice</h1>
        <div style="display: flex; justify-content: center; gap: 12px; align-items: center; margin-bottom: 12px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">
            <span>📅 Last Updated: July 2026</span>
            <span>✍️ Author: Rajesh Tarar</span>
        </div>
        <p class="tool-desc">Prepare for the official Lok Sewa civil service practical exams. Focus on accuracy, layout structure, and numbers layout drills.</p>
    </div>

    <!-- Practice Container -->
    <div class="converter-card" style="max-width: 900px; margin: 0 auto; padding: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="font-family: var(--font-heading); font-size: 1.1rem; font-weight: 600;">Government Exam Syllabus Drills</h3>
            <button class="action-btn primary" id="test-start">Start Practice</button>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;">
            <div class="metric-card" style="padding: 16px; text-align: center; background-color: rgba(0,0,0,0.15); border-radius: var(--border-radius-md);">
                <div class="metric-val" id="test-wpm" style="font-size: 1.5rem; font-weight: 700; color: var(--primary);">0</div>
                <div class="metric-lbl" style="font-size: 0.75rem; color: var(--text-muted);">Net WPM</div>
            </div>
            <div class="metric-card" style="padding: 16px; text-align: center; background-color: rgba(0,0,0,0.15); border-radius: var(--border-radius-md);">
                <div class="metric-val" id="test-accuracy" style="font-size: 1.5rem; font-weight: 700; color: #10b981;">100%</div>
                <div class="metric-lbl" style="font-size: 0.75rem; color: var(--text-muted);">Accuracy</div>
            </div>
            <div class="metric-card" style="padding: 16px; text-align: center; background-color: rgba(0,0,0,0.15); border-radius: var(--border-radius-md);">
                <div class="metric-val" id="test-timer" style="font-size: 1.5rem; font-weight: 700; color: var(--text-color);">2:00</div>
                <div class="metric-lbl" style="font-size: 0.75rem; color: var(--text-muted);">Timer</div>
            </div>
            <div class="metric-card" style="padding: 16px; text-align: center; background-color: rgba(0,0,0,0.15); border-radius: var(--border-radius-md);">
                <div class="metric-val" style="font-size: 1.25rem; font-weight: 700; color: var(--text-color);">Unicode</div>
                <div class="metric-lbl" style="font-size: 0.75rem; color: var(--text-muted);">Layout</div>
            </div>
        </div>

        <!-- Target Text Display -->
        <div class="text-display-box" id="test-display" style="min-height: 120px; font-size: 1.4rem; line-height: 2; padding: 24px; background-color: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); margin-bottom: 20px; font-family: var(--font-devanagari); letter-spacing: 0.05em; text-align: left;"></div>

        <!-- Input Box -->
        <input type="text" class="typing-input" id="test-input" placeholder="Start typing the text above..." autocomplete="off" disabled style="width: 100%; padding: 16px 20px; font-size: 1.25rem; background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); color: var(--text-color); outline: none; font-family: var(--font-devanagari);">
    </div>
</div>

<script src="/assets/js/typing-hub.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const test = TypingHub.initLokSewa(
            'practice',
            'test-display',
            'test-input',
            'test-wpm',
            'test-accuracy',
            'test-timer',
            'test-start'
        );
    });
</script>
