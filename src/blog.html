<div class="tool-section">
    <div class="tool-header">
        <h1 class="tool-title">Nepali Language & Typing Blog</h1>
        <p class="tool-desc">Discover guides, tips, and tutorials on Nepali typing, font converters, keyboard layouts, and standard Devanagari Unicode.</p>
    </div>

    <!-- Blog Grid (Dynamically Populated) -->
    <div id="blog-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 40px; margin-bottom: 60px;">
        <!-- JS will populate active posts here -->
    </div>
</div>

<script>
    // The compiler will replace the string below with the JSON metadata array
    const blogPosts = /* BLOG_POSTS_JSON */;

    (function() {
        const grid = document.getElementById('blog-grid');
        const now = new Date();
        
        // Filter out future posts
        const activePosts = blogPosts.filter(post => {
            const pDate = new Date(post.publishDate + "T00:00:00+05:00");
            return now >= pDate;
        });

        // Sort descending by publishDate
        activePosts.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));

        if (activePosts.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 48px;"><h3>No blog posts published yet. Please check back soon!</h3></div>';
            return;
        }

        grid.innerHTML = activePosts.map(post => `
            <article class="tool-card" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
                <div>
                    <span style="background-color: var(--primary-glow); color: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; display: inline-block; margin-bottom: 12px;">
                        \${post.category}
                    </span>
                    <h3 class="tool-card-title" style="font-size: 1.25rem; font-weight: 700; line-height: 1.3; margin-bottom: 8px;">
                        <a href="/blog/\${post.slug}/" style="color: inherit; text-decoration: none; transition: var(--transition-fast);" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='inherit'">
                            \${post.title}
                        </a>
                    </h3>
                    <p class="tool-card-desc" style="font-size: 0.875rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px;">
                        \${post.excerpt}
                    </p>
                </div>
                <div style="border-top: 1px solid var(--border-color); padding-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted);">
                    <span>📅 \${post.publishDate}</span>
                    <a href="/blog/\${post.slug}/" style="color: var(--primary); text-decoration: none; font-weight: 600;">Read More →</a>
                </div>
            </article>
        `).join('');
    })();
</script>
