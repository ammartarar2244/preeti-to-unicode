<div class="tool-section">
    <div class="tool-header">
        <h1 class="tool-title">Unicode Character Map</h1>
        <p class="tool-desc">Click on any Devanagari character, sign, or number below to copy it instantly to your clipboard.</p>

    <script>
        function copyChar(val) {
            navigator.clipboard.writeText(val)
                .then(() => showToast(`Copied "${val}" to clipboard!`))
                .catch(() => showToast("Failed to copy!"));
        }
    </script>
